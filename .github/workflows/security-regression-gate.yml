name: Security regression gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-regressions:
    name: Atlas security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATLAS_MODE: guarded
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Python version
        run: python3 --version

      - name: Run deterministic security regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
